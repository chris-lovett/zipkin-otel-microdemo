# Promtail configuration for log collection
# Install: helm upgrade --install promtail grafana/promtail -n observability -f deploy/observability/promtail-values.yaml

config:
  # Send logs to Loki
  clients:
    - url: http://loki:3100/loki/api/v1/push

  # Scrape configs for different log sources
  snippets:
    scrapeConfigs: |
      # Scrape all pod logs
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods in tracing-demo and consul namespaces
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: (tracing-demo|consul)
          # Add namespace label
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          # Add pod label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Add container label
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # Add app label
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          # Add datacenter label (for Consul)
          - source_labels: [__meta_kubernetes_pod_label_datacenter]
            target_label: datacenter
            regex: (.+)
          # Set default datacenter if not present
          - target_label: datacenter
            replacement: dc1
            regex: ^$
        pipeline_stages:
          # Parse JSON logs from Envoy/consul-dataplane
          - json:
              expressions:
                level: level
                msg: msg
                response_code: response_code
          # Add labels from parsed JSON
          - labels:
              level:
              response_code:

