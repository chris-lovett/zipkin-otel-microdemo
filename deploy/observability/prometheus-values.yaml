# Standalone Prometheus (prometheus-community/prometheus chart) in namespace observability.
# Scrapes Consul-injected pods via prometheus.io annotations on port 20200.
#
# Install / upgrade:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus prometheus-community/prometheus \
#     -n observability -f deploy/observability/prometheus-values.yaml

rbac:
  create: true

server:
  extraFlags:
    - web.enable-lifecycle

  # Mount Consul ACL token for server metrics scraping
  extraSecretMounts:
    - name: consul-acl-token
      secretName: consul-bootstrap-acl-token
      defaultMode: 0400
      mountPath: /var/run/secrets/consul-acl-token
      readOnly: true
      subPath: ""

  # Enable persistent volume
  persistentVolume:
    enabled: true
    size: 8Gi

  # In-cluster URL used by Consul UI metrics proxy
  fullnameOverride: prometheus-server

# Chart schema requires a string (appended to prometheus.yml), not a YAML array.
extraScrapeConfigs: |
  - job_name: consul-mesh-envoy
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: tracing-demo|consul
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: replace
        target_label: container

  - job_name: consul-servers
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - consul
    bearer_token_file: /var/run/secrets/consul-acl-token/token
    scheme: https
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_component]
        action: keep
        regex: server
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: consul
      - source_labels: []
        target_label: __metrics_path__
        replacement: /v1/agent/metrics
      - source_labels: [__address__]
        target_label: __param_format
        replacement: prometheus
      - source_labels: [__address__]
        regex: ([^:]+)(?::\d+)?
        replacement: ${1}:8501
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_datacenter]
        target_label: datacenter
      - source_labels: [__meta_kubernetes_pod_label_component]
        target_label: component

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

prometheus-pushgateway:
  enabled: false
