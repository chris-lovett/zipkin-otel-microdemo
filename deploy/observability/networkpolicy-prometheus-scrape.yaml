# Allow standalone Prometheus (observability) to scrape consul-dataplane metrics on :20200.
# Apply only if you use NetworkPolicies in tracing-demo.
#
#   kubectl apply -f deploy/observability/networkpolicy-prometheus-scrape.yaml

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: tracing-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 20200
