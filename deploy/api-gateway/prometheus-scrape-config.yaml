# Add this scrape config to Prometheus to scrape API Gateway with job="consul-api-gateway"
# 
# This can be added to the prometheus-server ConfigMap or via Helm values
#
# For Helm-based Prometheus, add to values.yaml:
#
# serverFiles:
#   prometheus.yml:
#     scrape_configs:
#       - job_name: 'consul-api-gateway'
#         kubernetes_sd_configs:
#           - role: pod
#             namespaces:
#               names:
#                 - tracing-demo
#         relabel_configs:
#           - source_labels: [__meta_kubernetes_pod_label_component]
#             action: keep
#             regex: api-gateway
#           - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
#             action: keep
#             regex: true
#           - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
#             action: replace
#             target_label: __metrics_path__
#             regex: (.+)
#           - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
#             action: replace
#             regex: ([^:]+)(?::\d+)?;(\d+)
#             replacement: $1:$2
#             target_label: __address__
#           - source_labels: [__meta_kubernetes_namespace]
#             target_label: namespace
#           - source_labels: [__meta_kubernetes_pod_name]
#             target_label: pod

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-api-gateway-scrape
  namespace: observability
data:
  api-gateway-scrape.yml: |
    - job_name: 'consul-api-gateway'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - tracing-demo
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_component]
          action: keep
          regex: api-gateway
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod

