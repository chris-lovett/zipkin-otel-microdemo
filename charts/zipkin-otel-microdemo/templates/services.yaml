{{- range $name := keys .Values.services | sortAlpha }}
{{- $svc := index $.Values.services $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/federate"
        {{- if $svc.consulUpstreams }}
        consul.hashicorp.com/connect-service-upstreams: {{ $svc.consulUpstreams | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $.Values.waitForDependencies.enabled $svc.dependsOn }}
      initContainers:
        {{- range $dep := $svc.dependsOn }}
        - name: wait-for-{{ $dep }}
          image: {{ $.Values.waitForDependencies.image | quote }}
          imagePullPolicy: {{ $.Values.waitForDependencies.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - >-
              until curl -fsS http://{{ $dep }}:{{ include "zipkin-otel-microdemo.dependencyPort" (dict "root" $ "dep" $dep) }}/health >/dev/null; do
              echo "waiting for {{ $dep }}";
              sleep 2;
              done
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "zipkin-otel-microdemo.appImage" (dict "Values" $.Values "repository" $svc.image.repository "tag" $svc.image.tag) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $.Values.appSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $svc.service.port }}
              protocol: TCP
          env:
            {{- range $k := keys $svc.env | sortAlpha }}
            - name: {{ $k }}
              value: {{ index $svc.env $k | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: prometheus-sidecar
          image: prom/prometheus:v2.45.0
          imagePullPolicy: IfNotPresent
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.listen-address=0.0.0.0:9090'
            - '--storage.tsdb.retention.time=1h'
            - '--storage.tsdb.min-block-duration=1h'
            - '--storage.tsdb.max-block-duration=1h'
            - '--web.enable-lifecycle'
          ports:
            - name: prometheus
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            {{- toYaml $.Values.appSecurityContext | nindent 12 }}
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-sidecar-config
        - name: prometheus-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  type: {{ $svc.service.type }}
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      protocol: TCP
      targetPort: http
---
{{- end }}
