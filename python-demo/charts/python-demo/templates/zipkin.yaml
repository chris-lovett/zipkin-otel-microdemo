apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "python-demo.fullname" . }}-zipkin
  labels:
    {{- include "python-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "python-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: zipkin
  template:
    metadata:
      labels:
        {{- include "python-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: zipkin
      annotations:
        {{- if .Values.consul.connectInject }}
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/connect-service: {{ printf "%s-zipkin" (include "python-demo.fullname" .) | quote }}
        consul.hashicorp.com/connect-service-port: "http"
        {{- end }}
        {{- if .Values.consul.transparentProxy }}
        consul.hashicorp.com/transparent-proxy: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ include "python-demo.fullname" . }}-zipkin{{ else }}{{ default "default" .Values.serviceAccount.name }}{{ end }}
      containers:
        - name: zipkin
          image: "{{ .Values.zipkin.image.repository }}:{{ .Values.zipkin.image.tag }}"
          imagePullPolicy: {{ .Values.zipkin.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.zipkin.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.zipkin.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "python-demo.fullname" . }}-zipkin
  labels:
    {{- include "python-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: zipkin
spec:
  type: {{ .Values.zipkin.service.type }}
  selector:
    {{- include "python-demo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: zipkin
  ports:
    - name: http
      port: {{ .Values.zipkin.service.port }}
      targetPort: http
      protocol: TCP
