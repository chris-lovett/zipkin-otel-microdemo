{{- $fullname := include "python-demo.fullname" . -}}
{{- $selectorLabels := include "python-demo.selectorLabels" . -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-service-c
  labels:
    {{- include "python-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-c
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
      app.kubernetes.io/component: service-c
  template:
    metadata:
      labels:
        {{- $selectorLabels | nindent 8 }}
        app.kubernetes.io/component: service-c
      annotations:
        {{- if .Values.consul.connectInject }}
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/connect-service: {{ printf "%s-service-c" $fullname | quote }}
        consul.hashicorp.com/connect-service-port: "http"
        {{- end }}
        {{- if .Values.consul.transparentProxy }}
        consul.hashicorp.com/transparent-proxy: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ $fullname }}-service-c{{ else }}{{ default "default" .Values.serviceAccount.name }}{{ end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: service-c
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "service_c.py"]
          env:
            - name: SERVICE_NAME
              value: service-c
            - name: PORT
              value: {{ .Values.services.serviceC.port | quote }}
            - name: ZIPKIN_URL
              value: http://{{ $fullname }}-zipkin:{{ .Values.zipkin.service.port }}/api/v2/spans
          ports:
            - name: http
              containerPort: {{ .Values.services.serviceC.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.services.serviceC.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-service-c
  labels:
    {{- include "python-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-c
spec:
  type: {{ .Values.services.serviceC.service.type }}
  selector:
    {{- $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: service-c
  ports:
    - name: http
      port: {{ .Values.services.serviceC.port }}
      targetPort: http
      protocol: TCP
---
