apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-tracing-demo
  namespace: consul
spec:
  podSelector:
    matchLabels:
      app: consul
      component: server
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from tracing-demo namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tracing-demo
    ports:
    - protocol: TCP
      port: 8501
    - protocol: TCP
      port: 8502
    - protocol: TCP
      port: 8301
    - protocol: TCP
      port: 8300
  # Allow traffic from within consul namespace (for webhook and other components)
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8501
    - protocol: TCP
      port: 8502
    - protocol: TCP
      port: 8301
    - protocol: TCP
      port: 8300

